name: Get Citation Data

on: 
 page_build: 
 schedule:
  - cron:  '0 8 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v2

    - name: Install Reqs
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-setuptools
        python3 -m pip install --upgrade pip

    - name: Run
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      run: |
        set -e

        cd ./google_scholar_crawler
        pip3 install -r requirements.txt

        # IMPORTANT: prevent infinite hanging if Scholar blocks Actions IP
        timeout 300 python3 main.py

        cd ./results
        git init
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"

        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data" || echo "No changes to commit"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
