# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Site Settings
title                    : "Lorem ipsum"
description              : "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Vivamus ornare aliquet ipsum, ac tempus justo dapibus sit amet. "
repository               : "RayeRen/acad-homepage.github.io"
google_scholar_stats_use_cdn : true

# google analytics
google_analytics_id      :  # get google_analytics_id from https://analytics.google.com/analytics/

# SEO Related
google_site_verification :  # get google_site_verification from https://search.google.com/search-console/about
bing_site_verification   :  # get bing_site_verification from https://www.bing.com/webmasters/about
baidu_site_verification  :  # get baidu_site_verification from https://ziyuan.baidu.com/login/index?u=/site/index

# Site Author
author:
  name             : "Chang Liu"
  avatar           : "images/android-chrome-512x512.png"
  bio              : >
    "Dr Chang Liu is currently a Lecturer (Assistant Professor equivalent in the U.S. system) in the Department of Computer Science and Information Technology at La Trobe University, Melbourne, Australia.
    He received his PhD from Dalian University of Technology, China, in 2017. During his doctoral studies, he was a Joint PhD Scholar with the University of Tennessee, Knoxville, USA, in 2015.
    Prior to joining La Trobe University, Dr Liu held research and academic positions at several internationally recognised institutions. He was a Postdoctoral Research Fellow at the University of New South Wales (UNSW), Sydney, 
    working with Prof. Derrick Wing Kwan Ng. He was also an Alexander von Humboldt Research Fellow at Friedrich-Alexander University Erlangen-Nürnberg, Germany, under the mentorship of Prof. Robert Schober. 
    In addition, he served as an Assistant Professor (Research) at The Hong Kong Polytechnic University.
    
    Dr Liu has published over 70 peer-reviewed papers, including 31 Q1 journal papers and 20 first-authored publications, in leading international journals and conferences. His work has accumulated more than 3,000 citations, 
    with an h-index of 25. He is the first author of three papers in IEEE Journal on Selected Areas in Communications (IEEE JSAC), widely regarded as one of the most prestigious journals
    in the communications field (Impact Factor: 17.2).
    
    He is a recipient of the Alexander von Humboldt Research Fellowship (a lifetime honour and Germany’s most prestigious international research fellowship) and the La Trobe University Vice-Chancellor’s Research Excellence Award 
    (one of only two university-wide recipients). Since 2022, he has been consistently recognised among Stanford University’s World’s Top 2% Scientists." 
  location         : "Beijing, China"
  employer         :
  pubmed           : 
  googlescholar    : "https://scholar.google.com/citations?user=YOUR_GOOGLE_SCHOLAR_ID"
  email            : "Lorem@ipsum.com"
  researchgate     :  # e.g., "https://www.researchgate.net/profile/yourprofile"
  uri              :
  bitbucket        :
  codepen          :
  dribbble         :
